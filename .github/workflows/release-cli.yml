name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tine
            archive_ext: tar.gz
            asset_name: tine-x86_64-linux

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tine
            archive_ext: tar.gz
            asset_name: tine-x86_64-macos

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tine
            archive_ext: tar.gz
            asset_name: tine-aarch64-macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tine.exe
            archive_ext: zip
            asset_name: tine-x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p tine_cli --target ${{ matrix.target }}

      - name: Prepare archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package

          cp "target/${TARGET}/release/${ARTIFACT_NAME}" dist/package/${ARTIFACT_NAME}

          if [ "${ARCHIVE_EXT}" = "tar.gz" ]; then
            tar -czf "dist/${ASSET_NAME}-${VERSION}.tar.gz" -C dist/package .
          else
            cd dist/package
            7z a "../${ASSET_NAME}-${VERSION}.zip" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}-${{ github.ref_name }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS