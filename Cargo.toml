[workspace]
members = [
    "crates/ast",
    "crates/checker",
    "crates/cli",
    "crates/common",
    "crates/expander",
    "crates/ir",
    "crates/macros",
    "crates/parser",
    "crates/server",
    "crates/symbols",
    "crates/transpiler",
    "crates/types",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true